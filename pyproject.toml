[project]
name = "streaming-live-rag"
version = "0.1.0"
description = "Streaming Live RAG — Samsung Theme 4"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # Retrieval
    "bm25s>=0.2",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # NLP
    "spacy>=3.7",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    # Telemetry (core — always on)
    "ulid-py>=1.1",
    # Telemetry (optional — obs profile)
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
asr = [
    "faster-whisper>=1.0",
]

[project.scripts]
slrag = "slrag.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slrag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
