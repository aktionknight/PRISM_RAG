[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slrag"
version = "0.1.0"
description = "Streaming Live RAG engine (PRISM) — Samsung Theme 4"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Component 4 NLI verifier backend (nli-deberta-v3-small). Optional: the
# deterministic lexical scorer is the default so CI stays offline.
nli = ["sentence-transformers>=2.7"]
# Optional NER for the verifier copy check (verifier.entity_backend: spacy, audit W-6).
ner = ["spacy>=3.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
