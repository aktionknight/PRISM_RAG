# Retrieval Controller — Tunable Thresholds
# HC-2: No magic numbers in application code. All thresholds live here.
# Calibrated via Phase 2 sweep (early-trigger-rate vs false-trigger-rate curve, knee selected).
llm_tiebreak_enabled: false  # Reserve early decomposition, final reconciliation and synthesis calls
exclusive_request_pattern: '\b(?:just|only)\s+(?P<request>(?:list|include|describe|explain|mention|show|give)\s+(?:(?:the|a|an)\s+)?(?P<object>[^.!?;]+))'
withdrawal_patterns:
  - '\b(?:do\s+not|don[\x27\u2019]?t)\s+(?:list|include|describe|explain|mention|show|give)\s+(?:(?:the|a|an)\s+)?(?P<object>[^.!?;]+)'

# Stage 2 — BM25 Corpus Discriminativeness Probe
tau_hi: 0.15          # margin above this → RETRIEVE (corpus is discriminative)
tau_lo: 0.05          # margin below this → WAIT (corpus is ambiguous)
h_lo: 0.65            # normalised entropy below this → peaked distribution
top_k_probe: 10       # number of top BM25 results to analyse
margin_top_n: 5       # number of top scores for margin denominator (s2..sN)

# Stage 3 — Embedding Stability
epsilon: 0.15         # drift below this → intent has stabilised
content_anchor_min: 2 # minimum content anchors required for stability trigger

# Cascade — Refractory Period
refractory_ms: 100.0  # cooldown between consecutive RETRIEVE decisions (ms)

# Speculation Manager
speculation_drift_delta: 0.30  # embedding drift above this → cancel speculative branch
self_correction_markers:
  - "actually"
  - "no wait"
  - "sorry"
  - "i meant"
  - "scratch that"
  - "never mind"
  - "forget that"
  - "not that"
  - "wait no"
  - "let me rephrase"
  - "correction"

# Stage 0 — Suppression Gate
presentation_verbs:
  - "repeat"
  - "rephrase"
  - "shorten"
  - "summarize"
  - "summarise"
  - "bullets"
  - "bullet points"
  - "translate"
  - "tone"
  - "reformat"
  - "simplify"
  - "elaborate"
  - "expand"
  - "make it shorter"
  - "make it longer"
  - "say that again"
  - "in other words"
  - "put it differently"
presentation_reference_words: [describe, previous, last, short, brief, briefly, could]
request_clause_boundary: '\b(?:and|also|plus)\s+(?=(?:what|why|how|where|when|which|who|list|identify|describe|explain|compare|name|show|give)\b)'
request_prefix_pattern: '^\s*(?:list|identify|describe|explain|compare|name|show|give)\s+'
request_pronoun_pattern: '\b(?:they|them|their|it|its)\b'
intent_request_operators: [list, identify, describe, explain, compare, name, what, why, how, where, when, which, who]

anaphora_patterns:
  - "that"
  - "this"
  - "it"
  - "the above"
  - "your answer"
  - "your last answer"
  - "your response"
  - "the response"
  - "what you said"
  - "what you just said"

additive_markers:
  - "also"
  - "as well"
  - "too"
  - "in addition"
  - "and for"
